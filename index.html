<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>mygram</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Orbitron:wght@400..900&family=Pacifico&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <header>
                <h1 class="logo">mygram</h1>
                <img id="doc-el" class="profile" src="images/user-avatar.png" alt="Profile Picture">
            </header>
            <main>
                <section>
                <div class="top">
                    <img id="post-el" class="profile side" src="images/avatar-vangogh.jpg" alt="Profile Picture">
                    <div class="space-ele">
                        <h2 id="name-el">Vincent Van Gogh</h2>
                        <h3 id="loc-el">Lagos  Nigeria</h3>
                    </div>
                </div>
                <div class="middle">
                    <img class="main-pic" src="images/post-vangogh.jpg" alt="Profile Picture">
                </div>
                <div>
                    <div>
                        <img class="icon" src="images/icon-heart.png" alt="Profile Picture">
                        <img class="icon" src="images/icon-comment.png" alt="Profile Picture">
                        <img class="icon" src="images/icon-dm.png" alt="Profile Picture">
                    </div>
                    <div>
                        <p id="like-el">1,000 Likes</p>
                        <p id="comment-el"><span id="user-el">vincey1853</span> just took a few mushrooms lol</p>
                    </div>
                </div>
            </section>
            </main>
        </div>
    </body>
</html>
